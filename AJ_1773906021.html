<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A & J - Party</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(45deg, #ff006e, #fb5607, #ffbe0b, #8338ec);
            background-size: 400% 400%; animation: gradientShift 8s ease infinite;
            font-family: 'Comic Sans MS', 'Arial Black', sans-serif;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        .container { position: relative; width: 90%; max-width: 380px; }
        .particle { position: absolute; font-size: 2rem; z-index: 10; animation: float 3s ease-in-out infinite; }
        .p1 { top: 10px; left: 10px; animation-delay: 0s; }
        .p2 { top: 20px; right: 20px; animation-delay: 1s; }
        .p3 { bottom: 80px; left: -10px; animation-delay: 2s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(10px, -10px) rotate(10deg); }
            66% { transform: translate(-10px, 10px) rotate(-10deg); } }
        .card { background: white; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center; padding: 2.5rem 1.5rem; border: 4px dashed #ff006e;
        }
        .logo-wrap { width: 100px; height: 100px; margin: 0 auto 1.5rem; border-radius: 50%;
            border: 4px solid #ffbe0b; display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: white; box-shadow: 0 0 20px rgba(255, 190, 11, 0.4);
        }
        .logo-img { width: 90%; height: 90%; object-fit: cover; border-radius: 50%; }
        h1 { font-size: 2rem; color: #ff006e; margin: 10px 0; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; animation: bounce 1s ease-in-out infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .subtitle { color: #333; font-size: 1.1rem; margin-bottom: 1.5rem; font-weight: bold;
            text-transform: uppercase; color: #8338ec;
        }
        .btn { display: block; width: 100%; padding: 13px; margin-bottom: 10px; font-size: 0.95rem;
            border-radius: 20px; font-weight: bold; text-decoration: none; border: none; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: linear-gradient(135deg, #ff006e, #fb5607); color: white;
            box-shadow: 0 5px 20px rgba(255, 0, 110, 0.4); }
        .btn-outline { background: white; color: #ff006e; border: 3px solid #ff006e; }
        .timer { font-size: 0.9rem; color: #666; margin-top: 1.5rem; font-weight: bold; }
    </style>
    <style>
        .brand-footer {
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 25px 25px;
            
        }
        .footer-left { display: flex; align-items: center; gap: 10px; }
        .brand-logo-container {
            background: white;
            padding: 2px;
            border-radius: 6px;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-logo { width: 24px; height: auto; }
        .brand-info { display: flex; flex-direction: column; text-align: left; }
        .brand-name { font-size: 0.75rem; font-weight: 700; color: white; }
        .brand-tag { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .qr-icon { font-size: 1.2rem; opacity: 0.5; }</style>
</head>
<body>
    <div class="container">
        <div class="particle p1">🎊</div>
        <div class="particle p2">🎈</div>
        <div class="particle p3">🎁</div>
        <div class="card">
            <div class="logo-wrap"><img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/logos/AJ_1773906021_logo.png" class="logo-img"></div>
            <h1>We cordially invite for our Wedding Receiption</h1>
            <div class="subtitle">on 20-05-2026 evening @ 7.00 pm</div>
            <a href="https://share.google/EmePzEhkbHeLffXNS" class="btn btn-primary">🎉 Join The Fun</a>
            <a href="tel:+919944378141" class="btn btn-outline">📞 More Info</a>
            <div class="timer">Getting ready in <b id="countdown">10</b>s...</div>
        </div>
        <div class="brand-footer">
                <div class="footer-left">
                    <div class="brand-logo-container">
                        <img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/gpr_logo.png" alt="GPR" class="brand-logo">
                    </div>
                    <div class="brand-info">
                        <span class="brand-tag">Powered By</span>
                        <span class="brand-name">G.P.R Offset Printers</span>
                    </div>
                </div>
                <div class="qr-icon">&#128424;</div>
            </div>
    </div>
    <script>
        let t = 10;
        setInterval(() => { t--; if(document.getElementById('countdown')) document.getElementById('countdown').innerText = t;
            if (t <= 0) window.location.replace('https://share.google/EmePzEhkbHeLffXNS'); }, 1000);
    </script>
</body>
</html>
