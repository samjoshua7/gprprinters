<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcf7f, #4d96ff);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 3px dashed #ff6b6b;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 25px;
            border: 4px solid #4d96ff;
            object-fit: cover;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            color: #ff6b6b;
            font-size: 1.9rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6bcf7f;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .cta {
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            display: inline-block;
            transition: all 0.3s;
        }

        .cta:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        .timer {
            margin-top: 20px;
            color: #4d96ff;
            font-weight: bold;
            font-size: 1rem;
        }

        .container { position: relative; max-width: 380px; width: 90%; }
    </style>
    <style>
        .brand-footer {
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 28px 28px;
            
        }
        .footer-left { display: flex; align-items: center; gap: 10px; }
        .brand-logo-container {
            background: white;
            padding: 2px;
            border-radius: 6px;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-logo { width: 24px; height: auto; }
        .brand-info { display: flex; flex-direction: column; text-align: left; }
        .brand-name { font-size: 0.75rem; font-weight: 700; color: white; }
        .brand-tag { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .qr-icon { font-size: 1.2rem; opacity: 0.5; }</style>
</head>
<body>
    <div class="container">
        <div style="background: white; border-radius: 30px 30px 0 0; border: 3px dashed #ff6b6b; padding: 40px 2rem 2rem; text-align: center;">
            <img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/logos/MiracleFarm_1773649619_logo.jpg" alt="Logo" class="logo">
            <h1>Poultry Farm</h1>
            <p class="subtitle">Eggs, Chicks, Hen etc....</p>
            <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <button class="cta" onclick="redirect('https://maps.app.goo.gl/smHBewZTV99ktghw6')">🧭 REDIRECT NOW</button>
                <a href="tel:+916369245945" class="cta" style="background: white; color: #4d96ff; border: 2px solid #4d96ff; text-decoration: none;">📞 CALL NOW</a>
            </div>
            <div class="timer">Redirecting in <span id="countdown">10</span>s ⏰</div>
        </div>
        <div class="brand-footer">
                <div class="footer-left">
                    <div class="brand-logo-container">
                        <img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/gpr_logo.png" alt="GPR" class="brand-logo">
                    </div>
                    <div class="brand-info">
                        <span class="brand-tag">Powered By</span>
                        <span class="brand-name">G.P.R Offset Printers</span>
                    </div>
                </div>
                <div class="qr-icon">&#128424;</div>
            </div>

    <script>
        let time = 10;

        function redirect(url) {
            window.location.href = url;
        }

        setInterval(() => {
            time--;
            document.getElementById('countdown').textContent = time;
            if (time === 0) {
                redirect('https://maps.app.goo.gl/smHBewZTV99ktghw6');
            }
        }, 1000);
    </script>
</body>
</html>
