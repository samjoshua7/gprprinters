<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Matrimony - TEST-QR-GPR-SAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f9f295 50%, #d4af37 100%);
            --royal-blue: #1a252f;
            --cream: #fffdf5;
            --text-gold: #b8860b;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #ffffff 0%, #f3e5ab 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .card-wrapper {
            position: relative;
            width: 90%;
            max-width: 400px;
            animation: float 4s ease-in-out infinite;
            z-index: 10;
        }

        .card {
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 8px;
            background: var(--gold-gradient);
        }

        .card-content { padding: 2.5rem 2rem 1.5rem 2rem; }

        .client-logo-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem auto;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        .client-logo-img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .main-headline {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: var(--text-gold);
            margin: 10px 0 5px 0;
            font-weight: 400;
        }

        .sub-headline {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .divider {
            width: 60%;
            height: 1px;
            background: var(--gold-gradient);
            margin: 0 auto 25px auto;
            position: relative;
        }

        .divider::after {
            content: "✨";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 10px;
            font-size: 0.8rem;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 16px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            letter-spacing: 1.5px;
            border-radius: 50px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--royal-blue);
            color: white;
            box-shadow: 0 4px 15px rgba(26, 37, 47, 0.3);
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: scale(1.03);
            background: #2c3e50;
        }

        .btn-secondary {
            background: transparent;
            color: var(--royal-blue);
            border: 1px solid var(--royal-blue);
        }

        .btn-secondary:hover {
            background: #fdfaf0;
        }

        .auto-redirect-msg {
            font-size: 0.75rem;
            color: #999;
            margin-top: 15px;
            letter-spacing: 1px;
        }
        
        #countdown { color: var(--text-gold); font-weight: bold; }

        .brand-footer {
            background: var(--royal-blue);
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 20px 20px;
            border-top: 2px solid #d4af37;
        }

        .footer-left { display: flex; align-items: center; gap: 12px; }

        .brand-logo-container {
            background: white;
            padding: 4px;
            width: 35px; height: 35px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
        }

        .brand-logo { width: 28px; height: auto; }

        .brand-info { display: flex; flex-direction: column; text-align: left; }
        .brand-name { font-size: 0.7rem; font-weight: 700; color: #fff; margin-top: 1px; }
        .brand-tag { font-size: 0.55rem; color: #d4af37; text-transform: uppercase; letter-spacing: 1.5px; }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <div class="card-content">
                <div class="client-logo-wrapper">
                    <img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/logos/TESTQRGPRSAM_1771867277_logo.png" alt="Logo" class="client-logo-img">
                </div>
                
                <h1 class="main-headline">Sharon weds Jacob</h1>
                <div class="sub-headline">We warmly invite you...</div>
                
                <div class="divider"></div>

                <div class="btn-container">
                    <a href="#" onclick="redirectNow('https://maps.app.goo.gl/WRfxki1uPoJwiHR9A'); return false;" class="action-btn btn-primary">
                        <span>✨ Enter Celebration</span>
                    </a>
                    
                    <a href="tel:+916374319622" class="action-btn btn-secondary">
                        <span>📞 Contact Details</span>
                    </a>
                </div>

                <div class="auto-redirect-msg">
                    Opening the invitation in <span id="countdown">10</span> seconds...
                </div>
            </div>

            <div class="brand-footer">
                <div class="footer-left">
                    <div class="brand-logo-container">
                        <img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/gpr_logo.png" alt="GPR" class="brand-logo">
                    </div>
                    <div class="brand-info">
                        <span class="brand-tag">Exquisite Printing by</span>
                        <span class="brand-name">G.P.R OFFSET PRINTERS</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const redirectURL = 'https://maps.app.goo.gl/WRfxki1uPoJwiHR9A';

        function redirectNow(url) {
            window.location.href = url;
        }

        const timerElement = document.getElementById('countdown');
        const countdownInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft >= 0 && timerElement) timerElement.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.replace(redirectURL);
            }
        }, 1000);
    </script>
</body>
</html>
