<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanks for Visiting!</title>
    
    <script>
        // --- Configuration ---
        
        // 1. LINKS
        // The link to write a review
        const reviewURL = "https://g.page/r/CTkOSQZel0M4EBM/review"; 
        // The link for Google Maps Directions
        const directionsURL = "https://maps.app.goo.gl/qCqCvVBkwxoB9e2w9"; 
        
        // 2. Client Info
        const clientName = "SS Pet Care"; 
        const clientLogoURL = "https://content.jdmagicbox.com/comp/tirunelveli/l8/0462px462.x462.210318160209.e4l8/catalogue/ss-veterinary-hospital-vm-chatram-tirunelveli-pet-clinics-2xsqlys62y.jpg"; 
        
        // 3. YOUR Branding (Footer)
        const myBrandName = "G.P.R Offset Printers";
        const myBrandLogo = "https://raw.githubusercontent.com/samjoshua7/gprprinters/main/gpr_logo.png"; 
        
        // 4. Timer Settings
        let timeLeft = 12; // Increased to 12 seconds
    </script>

    <style>
        :root {
            --bg-cream: #fffbeb;
            --paw-print-color: #fde68a;
            --vet-blue: #0ea5e9; 
            --vet-dark: #0c4a6e;
            --gold-star: #fbbf24;
            --text-dark: #333333;
            --btn-green: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-cream);
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            /* Background Pattern */
            background-image: radial-gradient(var(--paw-print-color) 15%, transparent 16%),
                              radial-gradient(var(--paw-print-color) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            overflow-x: hidden; /* Prevent scrollbar if animals poke out too much */
        }

        /* --- Main Layout Wrapper --- */
        .card-wrapper {
            position: relative;
            width: 90%;
            max-width: 380px;
            /* Visible overflow allows animals to hang off the edge */
            overflow: visible; 
            margin-top: 20px; /* Space for the dog on top */
        }

        /* --- Peeking Animals (Creative Part) --- */
        .peek-img {
            position: absolute;
            z-index: 10; /* Above the card */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            pointer-events: none; /* Let clicks pass through */
        }

        /* The Dog Peeking Top Left */
        .dog-peek {
            width: 100px;
            top: -65px;
            left: -10px;
            transform-origin: bottom center;
            animation: wiggle 3s ease-in-out infinite;
        }

        /* The Cat Peeking Bottom Right */
        .cat-peek {
            width: 80px;
            bottom: 70px; /* Just above footer */
            right: -25px;
            transform: rotate(15deg);
            transform-origin: bottom right;
            animation: wiggleCat 4s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        @keyframes wiggleCat {
            0%, 100% { transform: rotate(15deg) translateY(0); }
            50% { transform: rotate(10deg) translateY(5px); }
        }

        /* --- The Card Itself --- */
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); /* Deeper shadow for pop */
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            border: 3px solid white;
        }

        .card-content { padding: 2.5rem 1.5rem 1.5rem 1.5rem; }

        /* --- Client Branding --- */
        .client-logo-wrapper {
            width: 85px;
            height: 85px;
            margin: 0 auto 0.5rem auto;
            border-radius: 50%;
            padding: 4px;
            border: 2px dashed var(--vet-blue);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .client-logo-img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%;
        }

        .main-headline {
            font-size: 1.4rem;
            color: var(--text-dark);
            font-weight: 800;
            margin: 5px 0 5px 0;
            line-height: 1.2;
        }

        /* --- Action Buttons --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
            position: relative;
            z-index: 20; /* Ensure clickable */
        }

        .action-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .action-btn:active { transform: scale(0.96); }

        .btn-review {
            background: var(--gold-star);
            color: #4a3800;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.4);
        }

        .btn-directions {
            background: white;
            color: var(--vet-blue);
            border: 2px solid var(--vet-blue);
        }

        /* --- Timer Status --- */
        .auto-redirect-msg {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        .auto-redirect-msg b { color: var(--vet-blue); }

        /* --- BRAND FOOTER --- */
        .brand-footer {
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 21px 21px; /* Match card radius minus border */
            position: relative;
            overflow: hidden; /* Keep footer clean */
        }

        .footer-left { display: flex; align-items: center; gap: 10px; }

        .brand-logo-container {
            background: white;
            padding: 2px;
            border-radius: 6px;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
        }

        .brand-logo { width: 24px; height: auto; }

        .brand-info { display: flex; flex-direction: column; text-align: left; }

        .brand-name { font-size: 0.75rem; font-weight: 700; color: white; }
        .brand-tag { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; }
        .qr-icon { font-size: 1.2rem; opacity: 0.5; }

    </style>
</head>
<body>

    <div class="card-wrapper">
        
        <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" class="peek-img dog-peek" alt="Dog">
        
        <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" class="peek-img cat-peek" alt="Cat">

        <div class="card">
            <div class="card-content">
                <div class="client-logo-wrapper">
                    <img src="" alt="Vet Logo" class="client-logo-img" id="client-logo-display">
                </div>
                
                <h1 class="main-headline">Loving <span id="client-name-display"></span>?</h1>
                <div style="color: #64748b; font-size: 0.9rem;">Drop us a review or visit us! 🐾</div>

                <div class="btn-container">
                    <a href="#" onclick="redirectNow(reviewURL); return false;" class="action-btn btn-review">
                        <span>⭐ Rate Us 5 Stars</span>
                    </a>
                    
                    <a href="#" onclick="redirectNow(directionsURL); return false;" class="action-btn btn-directions">
                        <span>🗺️ Get Directions</span>
                    </a>
                </div>

                <div class="auto-redirect-msg">
                    Auto-redirecting to Reviews in <b id="countdown">10</b>s...
                </div>
            </div>

            <div class="brand-footer">
                <div class="footer-left">
                    <div class="brand-logo-container">
                        <img src="" alt="GPR" class="brand-logo" id="my-brand-logo">
                    </div>
                    <div class="brand-info">
                        <span class="brand-tag">Powered By</span>
                        <span class="brand-name">G.P.R Offset Printers</span>
                    </div>
                </div>
                <div class="qr-icon">🖨️</div>
            </div>
        </div>
    </div>

    <script>
        // Setup Data
        document.getElementById('client-name-display').innerText = clientName;
        document.getElementById('client-logo-display').src = clientLogoURL;
        document.getElementById('my-brand-logo').src = myBrandLogo;

        // Function to handle manual clicks
        function redirectNow(url) {
            window.location.href = url;
        }

        // Start Countdown
        const timerElement = document.getElementById('countdown');
        const countdownInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft >= 0) timerElement.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                // Default auto-redirect goes to REVIEW page
                window.location.replace(reviewURL);
            }
        }, 1000);
    </script>

</body>
</html>
