<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalon Stores</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --primary-dark: #2c3e50;
            --primary-light: #34495e;
            --text-dark: #2c3e50;
            --text-light: #555555;
            --accent-color: #e74c3c;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        .card-wrapper {
            position: relative;
            width: 90%;
            max-width: 380px;
            margin-top: 20px;
            overflow: visible;
        }

        .card {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            border-top: 6px solid var(--primary-dark);
        }

        .card-content { padding: 3rem 1.5rem 1.5rem 1.5rem; }

        .client-logo-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem auto;
            border: 1px solid #ddd;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .client-logo-img {
            width: 100%; height: 100%;
            object-fit: contain;
        }

        .main-headline {
            font-size: 1.6rem;
            color: var(--text-dark);
            font-weight: normal;
            margin: 0 0 15px 0;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 40px;
            height: 2px;
            background-color: var(--accent-color);
            margin: 0 auto 15px auto;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0;
        }

        .action-btn {
            border: 1px solid transparent;
            padding: 14px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--primary-dark);
            color: white;
        }
        .btn-primary:active { background: var(--primary-light); }

        .btn-secondary {
            background: transparent;
            color: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .btn-secondary:active { background: #f9f9f9; }

        .auto-redirect-msg {
            font-size: 0.8rem;
            color: #888;
            margin-top: 10px;
            font-style: italic;
        }
        
        .auto-redirect-msg b { color: var(--primary-dark); font-style: normal; }

        .brand-footer {
            background: #1a252f;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .footer-left { display: flex; align-items: center; gap: 10px; }

        .brand-logo-container {
            background: white;
            padding: 2px;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
        }

        .brand-logo { width: 22px; height: auto; }

        .brand-info { display: flex; flex-direction: column; text-align: left; }
        .brand-name { font-size: 0.75rem; font-family: 'Segoe UI', sans-serif; color: white; margin-top: 2px; }
        .brand-tag { font-size: 0.6rem; color: #a0aec0; font-family: 'Segoe UI', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="card">
            <div class="card-content">
                <div class="client-logo-wrapper">
                    <img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/logos/AvalonStores_1771750119_logo.png" alt="Customer Logo" class="client-logo-img">
                </div>
                
                <h1 class="main-headline">Thanks for visiting us!</h1>
                <div class="divider"></div>
                <div style="color: var(--text-light); font-size: 0.95rem;">We look forward to serving you.</div>

                <div class="btn-container">
                    <a href="#" onclick="redirectNow('https://share.google/moaaqtY7mfDQTN01k'); return false;" class="action-btn btn-primary">
                        <span>Visit Our Page</span>
                    </a>
                    
                    <a href="#" onclick="redirectNow('https://share.google/moaaqtY7mfDQTN01k'); return false;" class="action-btn btn-secondary">
                        <span>Learn More</span>
                    </a>
                </div>

                <div class="auto-redirect-msg">
                    Redirecting in <b id="countdown">10</b> seconds
                </div>
            </div>

            <div class="brand-footer">
                <div class="footer-left">
                    <div class="brand-logo-container">
                        <img src="https://raw.githubusercontent.com/samjoshua7/gprprinters/main/gpr_logo.png" alt="GPR" class="brand-logo">
                    </div>
                    <div class="brand-info">
                        <span class="brand-tag">Powered By</span>
                        <span class="brand-name">G.P.R Offset Printers</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const redirectURL = 'https://share.google/moaaqtY7mfDQTN01k';

        function redirectNow(url) {
            window.location.href = url;
        }

        const timerElement = document.getElementById('countdown');
        const countdownInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft >= 0) timerElement.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.replace(redirectURL);
            }
        }, 1000);
    </script>
</body>
</html>
